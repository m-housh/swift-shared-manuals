<form class="grid grid-cols-1 gap-4" hx-patch="/projects/00000000-0000-0000-0000-000000000000" hx-target="#content" hx-swap="innerHTML">
  <h1 class="text-3xl font-bold pb-6 ps-2">Project</h1>
  <input class="hidden" name="id" value="00000000-0000-0000-0000-000000000000">
  <fieldset>
    <legend class="fieldset-legend">Name</legend>
    <input class="input w-full" type="text" name="name" id="name" placeholder="Big Bird" value="Testy McTestface" required autofocus>
  </fieldset>
  <fieldset>
    <legend class="fieldset-legend">Address</legend>
    <input class="input w-full" type="text" name="streetAddress" id="streetAddress" placeholder="123 Sesame St." value="123 Sesame St." required>
  </fieldset>
  <fieldset>
    <legend class="fieldset-legend">City</legend>
    <input class="input w-full" type="text" name="city" id="city" placeholder="Manhattan" value="Manhattan" required>
  </fieldset>
  <fieldset>
    <legend class="fieldset-legend">State</legend>
    <input class="input w-full" type="text" name="state" id="state" placeholder="NY" value="NY" required>
  </fieldset>
  <fieldset>
    <legend class="fieldset-legend">Zip</legend>
    <input class="input validator w-full" type="text" name="zipCode" id="zipCode" placeholder="10001" value="10001" minlength="5" pattern="[0-9\-]*" required>
    <div class="validator-hint">
      <p>Enter 5 digit zip code. Numbers or '-' only</p>
    </div>
  </fieldset>
  <button class="btn btn-secondary btn-block my-6" type="submit">Submit</button>
</form>
