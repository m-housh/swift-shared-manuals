<div>
  <div class="flex justify-between bg-secondary border-2 border-primary rounded-sm shadow-sm 
p-6 w-full">
    <h1 class="text-3xl font-bold">Project</h1>
    <div class="tooltip tooltip-left" data-tip="Edit project">
      <button class="btn btn-primary" onclick="projectForm.showModal()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg></button>
    </div>
  </div>
  <table class="table table-zebra text-lg">
    <tbody>
      <tr>
        <td class="label font-bold">Name</td>
        <td>
          <div class="flex justify-end">Testy McTestface</div>
        </td>
      </tr>
      <tr>
        <td class="label font-bold">Street Address</td>
        <td>
          <div class="flex justify-end">123 Sesame St.</div>
        </td>
      </tr>
      <tr>
        <td class="label font-bold">City</td>
        <td>
          <div class="flex justify-end">Manhattan</div>
        </td>
      </tr>
      <tr>
        <td class="label font-bold">State</td>
        <td>
          <div class="flex justify-end">NY</div>
        </td>
      </tr>
      <tr>
        <td class="label font-bold">Zip</td>
        <td>
          <div class="flex justify-end">10001</div>
        </td>
      </tr>
    </tbody>
  </table>
  <dialog id="projectForm" class="modal">
    <div class="modal-box">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" onclick="projectForm.close();"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <form class="grid grid-cols-1 gap-4" hx-patch="/projects/00000000-0000-0000-0000-000000000000" hx-target="#content" hx-swap="innerHTML">
        <h1 class="text-3xl font-bold pb-6 ps-2">Project</h1>
        <input class="hidden" name="id" value="00000000-0000-0000-0000-000000000000">
        <fieldset>
          <legend class="fieldset-legend">Name</legend>
          <input class="input w-full" type="text" name="name" id="name" placeholder="Big Bird" value="Testy McTestface" required autofocus>
        </fieldset>
        <fieldset>
          <legend class="fieldset-legend">Address</legend>
          <input class="input w-full" type="text" name="streetAddress" id="streetAddress" placeholder="123 Sesame St." value="123 Sesame St." required>
        </fieldset>
        <fieldset>
          <legend class="fieldset-legend">City</legend>
          <input class="input w-full" type="text" name="city" id="city" placeholder="Manhattan" value="Manhattan" required>
        </fieldset>
        <fieldset>
          <legend class="fieldset-legend">State</legend>
          <input class="input w-full" type="text" name="state" id="state" placeholder="NY" value="NY" required>
        </fieldset>
        <fieldset>
          <legend class="fieldset-legend">Zip</legend>
          <input class="input validator w-full" type="text" name="zipCode" id="zipCode" placeholder="10001" value="10001" minlength="5" pattern="[0-9\-]*" required>
          <div class="validator-hint">
            <p>Enter 5 digit zip code. Numbers or '-' only</p>
          </div>
        </fieldset>
        <button class="btn btn-secondary btn-block my-6" type="submit">Submit</button>
      </form>
    </div>
  </dialog>
</div>
