<form class="grid grid-cols-1 gap-4" hx-post="/projects" hx-target="#content" hx-swap="innerHTML"><h1 class="text-3xl font-bold pb-6 ps-2">Project</h1><fieldset><legend class="fieldset-legend">Name</legend><input class="input w-full" type="text" name="name" id="name" placeholder="Big Bird" value="" required autofocus></fieldset><fieldset><legend class="fieldset-legend">Address</legend><input class="input w-full" type="text" name="streetAddress" id="streetAddress" placeholder="123 Sesame St." value="" required></fieldset><fieldset><legend class="fieldset-legend">City</legend><input class="input w-full" type="text" name="city" id="city" placeholder="Manhattan" value="" required></fieldset><fieldset><legend class="fieldset-legend">State</legend><input class="input w-full" type="text" name="state" id="state" placeholder="NY" value="" required></fieldset><fieldset><legend class="fieldset-legend">Zip</legend><input class="input validator w-full" type="text" name="zipCode" id="zipCode" placeholder="10001" value="" minlength="5" pattern="[0-9\-]*" required><div class="validator-hint"><p>Enter 5 digit zip code. Numbers or '-' only</p></div></fieldset><button class="btn btn-secondary btn-block my-6" type="submit">Submit</button></form>
