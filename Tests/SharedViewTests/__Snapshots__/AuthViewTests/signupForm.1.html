<div>
  <div class="flex justify-between">
    <h1 class="text-2xl font-bold mb-6">Sign Up</h1>
    Privacy Policy<a class="btn btn-link" href="/privacy-policy" target="_blank"></a>
  </div>
  <form action="/signup" method="post" class="space-y-4">
    <div>
      <label class="input validator w-full">  <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g
          stroke-linejoin="round"
          stroke-linecap="round"
          stroke-width="2.5"
          fill="none"
          stroke="currentColor"
        >
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </g>
      </svg>
      <input type="email" placeholder="Email" required name="email" id="email" autofocus autocomplete="email"></label>
      <div class="validator-hint hidden">Enter valid email address.</div>
    </div>
    <div>
      <label class="input validator w-full">  <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
          >
            <path
              d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
            ></path>
            <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
          </g>
        </svg>
      <input type="password" placeholder="Password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" minlength="8" name="password" id="password" autocomplete="new-password"></label>
    </div>
    <div>
      <label class="input validator w-full">  <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
          >
            <path
              d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
            ></path>
            <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
          </g>
        </svg>
      <input type="password" placeholder="Confirm Password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" minlength="8" name="confirmPassword" id="confirmPassword" autocomplete="new-password"></label>
    </div>
    <div class="validator-hint hidden">
      <p>
        Must be more than 8 characters, including
        <br>
        At least one number
        <br>
        At least one lowercase letter
        <br>
        At least one uppercase letter
      </p>
    </div>
    <div class="flex">
      <button class="btn btn-secondary mt-4 w-full">Sign Up</button>
    </div>
    <div class="flex justify-center"><a class="btn btn-link" hx-get="/login" hx-target="#loginForm" hx-swap="outerHTML swap:1s" hx-push-url="true">Login</a></div>
  </form>
</div>
